[tool.poetry]
name = "studious-engine"
version = "0.1.0"
description = "AI-powered learning platform"
authors = ["Studious Team <team@example.com>"]

[tool.poetry.dependencies]
python = "^3.10"
fastapi = "^0.110.0"
uvicorn = "^0.23.0"
openai = "^0.27.0"
typer = "^0.9.0"
SQLAlchemy = "^2.0.0"
requests = "^2.32.0"

[tool.poetry.group.dev.dependencies]
pytest = "^7.0"
ruff = "^0.4.0"

[tool.poetry.scripts]
studious-cli = "cli:app"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
